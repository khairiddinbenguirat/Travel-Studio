<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f0;color:#252a27;font:15px system-ui}header{background:#26362e;color:white;padding:20px 5%;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header strong{font-size:23px;margin-right:auto}main{max-width:1100px;margin:28px auto;padding:0 18px}button,input,select,textarea{font:inherit;padding:9px 12px;border:1px solid #ccd4cd;border-radius:7px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#527565;color:white;border:0}header button{color:#26362e}section,article{background:white;border:1px solid #e0e4de;border-radius:12px;padding:20px;margin:12px 0}h1,h2,h3{margin:0 0 14px}small{color:#65756a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0}.row>*{min-width:0}label{display:inline-flex;flex-direction:column;gap:4px;font-size:12px;color:#52635a}input,select{max-width:100%}details{border-top:1px solid #e1e5df;padding:12px 0}summary{cursor:pointer;font-weight:600}.day{background:#f4f6f2;padding:12px;border-radius:8px;margin:10px 0}.service{background:white;padding:10px;margin:8px 0;border-radius:8px}.checks{display:flex;flex-wrap:wrap;gap:10px}.checks label{display:flex;flex-direction:row;align-items:center;font-size:14px}.muted{color:#65756a}.danger{color:#a43b36}.stats{display:flex;gap:24px;flex-wrap:wrap;font-size:19px}textarea{width:100%}@media print{header,.no-print,button,input,select,textarea{display:none!important}body{background:white}section,article{border:0;break-inside:avoid}main{margin:0;max-width:none}}
</style><header><strong>◈ Travel Studio <small style="color:#c5d5ca">Sud tunisien</small></strong><button onclick="page='db';render()">Destinations</button><button onclick="page='trip';render()">Trip Planner</button><button onclick="page='settings';render()">Paramètres</button><span id="syncStatus" role="status" style="font-size:12px"></span></header><main id="app"></main><script>
const $=id=>document.getElementById(id), uid=()=>crypto.randomUUID(), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), cats=['Logement','Restaurant','Activité','Transport','Guide','Prestataire','Partenaire','Facility'];
let data;try{data=JSON.parse(localStorage.getItem('travel-studio-v1'))}catch{};if(!data)data={cities:['Djerba','Tataouine','Ksar Ghilane','Douz','Tozeur','Matmata'].map(name=>({id:uid(),name})),providers:[],trips:[]};let page='trip',active=data.trips[0]?.id,tab='plan',city='',session=null;localStorage.removeItem('ts-config');const save=()=>{localStorage.setItem('travel-studio-v1',JSON.stringify(data));dirty=true;persistMeta();schedule()};const change=()=>{save();render()};const trip=()=>data.trips.find(t=>t.id===active);const cityName=id=>data.cities.find(c=>c.id===id)?.name||'Destination';const provider=id=>data.providers.find(p=>p.id===id);const opt=(arr,val)=>arr.map(([v,n])=>`<option value="${esc(v)}" ${v===val?'selected':''}>${esc(n)}</option>`).join('');const field=(name,value,code,type='text')=>`<label>${name}<input type="${type}" value="${esc(value)}" onchange="${code}"></label>`;const sel=(name,arr,val,code)=>`<label>${name}<select onchange="${code}">${opt(arr,val)}</select></label>`;const money=n=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:2})+' TND';const date=(t,i)=>{let d=new Date(t.start+'T12:00:00');d.setDate(d.getDate()+i);return isNaN(d)?'':d.toLocaleDateString('fr-FR')};const all=t=>t.stages.flatMap((s,i)=>[...s.days.flatMap((d,j)=>d.items.map(a=>({a,s,j,i,transfer:false}))),...(i?s.transfer.map(a=>({a,s,j:0,i,transfer:true})):[])]);const dayIndex=(t,i,j)=>t.stages.slice(0,i).reduce((n,s)=>n+s.days.length,0)+j;const total=t=>all(t).flatMap(x=>x.a.links).reduce((r,l)=>[r[0]+l.buy*l.qty,r[1]+l.sell*l.qty,r[2]+l.deposit], [0,0,0]);function newTrip(){let t={id:uid(),name:'Nouveau séjour',start:new Date().toISOString().slice(0,10),pax:2,status:'Brouillon',stages:[]};data.trips.push(t);active=t.id;addStage(false);addStage(false);change()}function addStage(refresh=true){let t=trip();if(t.stages.length>=6)return;t.stages.push({city:data.cities[0]?.id||'',name:'',days:Array.from({length:2},()=>({items:[]})),transfer:[]});if(refresh)change()}function addItem(i,j,category){let s=trip().stages[i],a={id:uid(),name:j<0?'Transfert':'Nouvelle prestation',time:'09:00',category:j<0?'Transport':(cats.includes(category)?category:'Activité'),notes:'',links:[]};(j<0?s.transfer:s.days[j].items).push(a);change()}function item(id){return all(trip()).find(x=>x.a.id===id).a}function link(id,pid,on){let a=item(id),p=provider(pid);if(on)a.links.push({pid,qty:1,buy:p.buy,sell:p.sell,deposit:0,status:'À contacter',ref:''});else a.links=a.links.filter(l=>l.pid!==pid);change()}function editLink(id,pid,k,v){item(id).links.find(l=>l.pid===pid)[k]=v;change()}function removeItem(id){let t=trip();for(let s of t.stages){s.transfer=s.transfer.filter(a=>a.id!==id);for(let d of s.days)d.items=d.items.filter(a=>a.id!==id)}change()}
function render(){let t=trip();$('app').innerHTML=page==='db'?db():page==='settings'?settings():`<div class="row"><h1 style="margin-right:auto">Mes séjours</h1><button class="primary" onclick="newTrip()">+ Nouveau séjour</button></div><div class="row">${data.trips.map(x=>`<button onclick="active='${x.id}';tab='plan';render()" ${x.id===active?'class="primary"':''}>${esc(x.name)} · ${esc(x.status)}</button>`).join('')}</div>${t?planner(t):'<section>Créez votre premier séjour.</section>'}`}
function db(){return `<h1>Destinations & prestataires</h1><section><h2>Villes</h2><div class="row"><input id="newcity" placeholder="Nouvelle destination"><button class="primary" onclick="if($('newcity').value.trim()){data.cities.push({id:uid(),name:$('newcity').value.trim()});change()}">Ajouter</button></div>${data.cities.map(c=>`<div class="row">${field('Ville',c.name,`data.cities.find(c=>c.id==='${c.id}').name=this.value;change()`)}<button onclick="city='${c.id}';render()">Prestataires</button></div>`).join('')}</section><section><div class="row"><h2>Prestataires</h2>${sel('Filtrer',[['','Toutes les villes'],...data.cities.map(c=>[c.id,c.name])],city,'city=this.value;render()')}<button class="primary" onclick="data.providers.push({id:uid(),name:'Nouveau prestataire',category:'Activité',cities:city?[city]:[],phone:'',email:'',buy:0,sell:0,notes:''});change()">+ Ajouter</button></div>${data.providers.filter(p=>!city||p.cities.includes(city)).map(p=>`<article><div class="row">${field('Nom',p.name,`editP('${p.id}','name',this.value)`)}${sel('Catégorie',cats.map(c=>[c,c]),p.category,`editP('${p.id}','category',this.value)`)}${field('Téléphone',p.phone,`editP('${p.id}','phone',this.value)`)}${field('Email',p.email,`editP('${p.id}','email',this.value)`)}</div><div class="row">${field('Achat TND',p.buy,`editP('${p.id}','buy',+this.value)`,'number')}${field('Vente TND',p.sell,`editP('${p.id}','sell',+this.value)`,'number')}</div><small>Villes couvertes</small><div class="checks">${data.cities.map(c=>`<label><input type="checkbox" ${p.cities.includes(c.id)?'checked':''} onchange="cover('${p.id}','${c.id}',this.checked)">${esc(c.name)}</label>`).join('')}</div><textarea placeholder="Conditions, capacité, notes" onchange="editP('${p.id}','notes',this.value)">${esc(p.notes)}</textarea><button class="danger" onclick="deleteP('${p.id}')">Supprimer</button></article>`).join('')}</section>`}function editP(id,k,v){provider(id)[k]=v;change()}function cover(id,c,on){let p=provider(id);p.cities=on?[...new Set([...p.cities,c])]:p.cities.filter(x=>x!==c);change()}function deleteP(id){if(data.trips.some(t=>all(t).some(x=>x.a.links.some(l=>l.pid===id))))return alert('Prestataire utilisé dans un séjour.');if(confirm('Supprimer ?')){data.providers=data.providers.filter(p=>p.id!==id);change()}}
function planner(t){let n=t.stages.reduce((a,s)=>a+s.days.length,0),v=total(t);return `<section><div class="row">${field('Nom du séjour',t.name,'trip().name=this.value;change()')}${field('Départ',t.start,'trip().start=this.value;change()','date')}${field('Voyageurs',t.pax,'trip().pax=+this.value;change()','number')}<strong>${esc(t.status)}</strong></div><div class="stats"><span>${n} jours</span><span>${Math.max(0,n-1)} nuits</span><span>${t.stages.length} étapes</span><span>${money(v[1])} vente</span></div><div class="row">${[['plan','Programme'],['coord','Coordination'],['finance','Finance'],['doc','Documents']].map(([k,l])=>`<button class="${tab===k?'primary':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}<button onclick="validateTrip()">Valider le séjour</button><button onclick="duplicate()">Dupliquer</button><button onclick="trip().status='Archivé';change()">Archiver</button></div></section>${tab==='plan'?plan(t):tab==='coord'?coord(t):tab==='finance'?finance(t):docs(t)}`}
function validateTrip(){let t=trip(),n=t.stages.reduce((a,s)=>a+s.days.length,0);if(n<4||n>12||t.stages.length<2||t.stages.length>6||t.pax<1||!t.start||t.stages.some(s=>!s.city))return alert('Vérifiez : 4–12 jours, 2–6 étapes, dates et voyageurs.');t.status='Validé';tab='coord';change()}function duplicate(){let t=JSON.parse(JSON.stringify(trip()));t.id=uid();t.name+=' — copie';t.status='Brouillon';for(let x of all(t)){x.a.id=uid();for(let l of x.a.links){l.status='À contacter';l.deposit=0;l.ref=''}}data.trips.push(t);active=t.id;tab='plan';change()}
function plan(t){return t.stages.map((s,i)=>`<section>${i?`<h3>↳ Transfert ${esc(cityName(t.stages[i-1].city))} → ${esc(cityName(s.city))}</h3>${s.transfer.map(a=>service(a,s.city)).join('')}<button onclick="addItem(${i},-1)">+ Transport inter-étapes</button><hr>`:''}<h2>Étape ${i+1} · ${esc(cityName(s.city))}</h2><div class="row">${sel('Destination',data.cities.map(c=>[c.id,c.name]),s.city,`trip().stages[${i}].city=this.value;change()`)}${field('Nom personnalisé',s.name,`trip().stages[${i}].name=this.value;change()`)}<button onclick="move(${i},-1)">↑</button><button onclick="move(${i},1)">↓</button><button onclick="if(confirm('Supprimer cette étape et ses prestations ?')){trip().stages.splice(${i},1);change()}">Supprimer</button></div>${s.days.map((d,j)=>`<details open><summary>Jour ${dayIndex(t,i,j)+1} · ${date(t,dayIndex(t,i,j))}</summary><div class="day">${d.items.map(a=>service(a,s.city)).join('')}<select id="type-${i}-${j}" aria-label="Type de nouvelle prestation">${opt(cats.map(c=>[c,c]),'Activité')}</select> <button onclick="addItem(${i},${j},$('type-${i}-${j}').value)">+ Ajouter prestation</button> <button onclick="if(confirm('Supprimer cette journée ?')){trip().stages[${i}].days.splice(${j},1);change()}">Supprimer jour</button></div></details>`).join('')}<button onclick="trip().stages[${i}].days.push({items:[]});change()">+ Journée</button></section>`).join('')+`<button class="primary" onclick="addStage()">+ Étape</button>`}function move(i,d){let a=trip().stages,j=i+d;if(j>=0&&j<a.length){[a[i],a[j]]=[a[j],a[i]];change()}}
function matchesProvider(p,a,c){return p.category===a.category && p.cities.includes(c)}
function setCategory(id,value){item(id).category=value;change()}
function service(a,c){return `<div class="service"><div class="row">${field('Heure',a.time,`item('${a.id}').time=this.value;change()`,'time')}${field('Prestation',a.name,`item('${a.id}').name=this.value;change()`)}${sel('Type',cats.map(c=>[c,c]),a.category,`setCategory('${a.id}',this.value)`)}<button onclick="removeItem('${a.id}')">×</button></div><small>Prestataires (sélection multiple)</small><div class="checks">${data.providers.filter(p=>matchesProvider(p,a,c)).map(p=>`<label><input type="checkbox" ${a.links.some(l=>l.pid===p.id)?'checked':''} onchange="link('${a.id}','${p.id}',this.checked)">${esc(p.name)} · ${esc(p.category)}</label>`).join('')||'Aucun prestataire de ce type dans cette destination.'}</div>${a.links.map(l=>`<div class="row"><strong>${esc(provider(l.pid)?.name)}</strong>${!provider(l.pid)||!matchesProvider(provider(l.pid),a,c)?`<small class="danger">Hors filtre — affectation conservée</small><button onclick="link('${a.id}','${l.pid}',false)">Retirer</button>`:''}${['qty','buy','sell','deposit'].map((k,i)=>field(['Qté','Achat/u','Vente/u','Acompte'][i],l[k],`editLink('${a.id}','${l.pid}','${k}',+this.value)`,'number')).join('')}</div>`).join('')}<textarea placeholder="Consignes, rendez-vous" onchange="item('${a.id}').notes=this.value;change()">${esc(a.notes)}</textarea></div>`}
function groups(t){let g={};for(let x of all(t))for(let l of x.a.links)(g[l.pid]??=[]).push({...x,l});return g}function coord(t){return `<section><h2>Prestataires à contacter</h2><small>${Object.keys(groups(t)).length} prestataires distincts · ${esc(t.status)}</small>${Object.entries(groups(t)).map(([id,xs])=>{let p=provider(id);return `<article><h3>${esc(p?.name)}</h3><p>${esc(p?.phone)} · ${esc(p?.email)}</p>${xs.map(({a,l,i,j})=>`<div class="row"><strong>${date(t,dayIndex(t,i,j))} · ${esc(a.time)} · ${esc(a.name)}</strong><span>${money(l.buy*l.qty)}</span>${sel('Statut',['À contacter','Demande envoyée','En attente','Option','Confirmé','Refusé','Annulé'].map(s=>[s,s]),l.status,`editLink('${a.id}','${id}','status',this.value)`)}${field('Référence',l.ref,`editLink('${a.id}','${id}','ref',this.value)`)}</div>`).join('')}<button onclick="contact('${id}')">Copier demande</button> ${p?.email?`<a href="mailto:${encodeURIComponent(p.email)}">Email</a>`:''}</article>`}).join('')}<button onclick="printDoc('coord')">Imprimer / PDF coordination</button></section>`}function contact(id){let t=trip(),p=provider(id),xs=groups(t)[id];let msg=`Bonjour ${p.name},\nMerci de confirmer les disponibilités pour ${t.name}, ${t.pax} voyageurs :\n`+xs.map(x=>`${date(t,dayIndex(t,x.i,x.j))} ${x.a.time} : ${x.a.name} (qté ${x.l.qty})`).join('\n');navigator.clipboard.writeText(msg).then(()=>alert('Demande copiée')).catch(()=>prompt('Copier la demande',msg))}function finance(t){let [b,s,d]=total(t);return `<section><h2>Finance</h2><div class="stats">Achat ${money(b)} · Vente ${money(s)} · Marge ${money(s-b)} (${s?((s-b)/s*100).toFixed(1):0} %) · Acomptes ${money(d)} · Solde fournisseurs ${money(b-d)}</div></section>`}function docs(t){return `<section><h2>Documents</h2><div class="row">${[['client','Programme client'],['coord','Fiche coordination'],['road','Roadbook']].map(([k,n])=>`<button onclick="printDoc('${k}')">${n} · PDF</button>`).join('')}</div></section>`}function printDoc(kind){let t=trip(),w=window.open('','_blank');if(!w)return alert('Autorisez les fenêtres pop-up');let body=kind==='coord'?Object.entries(groups(t)).map(([id,xs])=>`<h2>${esc(provider(id)?.name)}</h2><p>${esc(provider(id)?.phone)} · ${esc(provider(id)?.email)}</p>${xs.map(x=>`<p>${date(t,dayIndex(t,x.i,x.j))} ${esc(x.a.time)} — ${esc(x.a.name)} · ${money(x.l.buy*x.l.qty)} · ${esc(x.l.status)} · Réf ${esc(x.l.ref)} · Solde ${money(x.l.buy*x.l.qty-x.l.deposit)}</p>`).join('')}`).join(''):t.stages.map((s,i)=>`<h2>${esc(cityName(s.city))} — ${esc(s.name)}</h2>${s.transfer.map(a=>`<p>Transfert : ${esc(a.name)}</p>`).join('')}${s.days.map((d,j)=>`<h3>Jour ${dayIndex(t,i,j)+1} · ${date(t,dayIndex(t,i,j))}</h3>${d.items.map(a=>`<p>${esc(a.time)} — ${esc(a.name)} ${kind==='road'?esc(a.notes)+' · '+a.links.map(l=>esc(provider(l.pid)?.name)+' '+esc(provider(l.pid)?.phone)).join(', '):''}</p>`).join('')}`).join('')}`).join('');w.document.write(`<html lang="fr"><meta charset="utf-8"><title>${esc(t.name)}</title><style>body{font:15px system-ui;margin:40px;color:#26362e}h2{border-bottom:1px solid #aaa;padding-bottom:8px}p{break-inside:avoid}</style><h1>Travel Studio — ${esc(t.name)}</h1><p>${esc(t.start)} · ${t.pax} voyageurs · ${kind==='coord'?'Coordination interne':kind==='road'?'Roadbook':'Programme client'}</p>${body}</html>`);w.document.close();w.print()}
function settings(){return `<section><h2>Sauvegarde locale</h2><button onclick="backup()">Exporter JSON</button> <input type="file" accept=".json" onchange="restore(this)"></section><section><h2>Espace sécurisé</h2><button onclick="syncNow()">Synchroniser maintenant</button> <button onclick="resolveConflict()">Résoudre un conflit</button> <button onclick="logout()">Déconnexion</button></section>`}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='travel-studio-backup.json';a.click();URL.revokeObjectURL(a.href)}async function restore(el){try{let d=JSON.parse(await el.files[0].text());if(!Array.isArray(d.cities)||!Array.isArray(d.providers)||!Array.isArray(d.trips))throw Error('Format invalide');if(confirm('Remplacer les données locales ?')){data=d;active=data.trips[0]?.id;change()}}catch(e){alert(e.message)}}async function api(path,method='GET',body){let action=path==='session'?'session':'workspace';if(method==='PATCH'||method==='POST'){body={payload:body.payload,revision:method==='POST'?null:body.revision-1};method='POST'}let r=await fetch('/api/gateway?action='+action,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});if(r.status===401){location.reload();throw Error('Session expirée')}if(!r.ok)throw Error(await r.text());return r.json()}let meta={};try{meta=JSON.parse(localStorage.getItem('ts-sync-meta')||'{}')}catch{};let dirty=!!meta.dirty,revision=meta.revision??null,owner=meta.owner||null,timer,busy=false,blocked=false,ready=false;
function persistMeta(){localStorage.setItem('ts-sync-meta',JSON.stringify({dirty,revision,owner}))}
function status(t){$('syncStatus').textContent=t}
function schedule(){clearTimeout(timer);if(session&&ready&&!blocked)timer=setTimeout(syncNow,700);else if(!session)status('Sauvegarde locale · non connecté')}
async function remote(){return (await api('/rest/v1/workspaces?owner=eq.'+session.user.id+'&select=payload,revision'))[0]}
function adopt(r){data=r.payload;revision=r.revision;dirty=false;localStorage.setItem('travel-studio-v1',JSON.stringify(data));persistMeta();active=data.trips.some(t=>t.id===active)?active:data.trips[0]?.id;render()}
async function login(){if(busy)return;busy=true;try{let next=await api('session');if(owner&&owner!==next.user.id)throw Error('Cet espace local appartient à un autre compte. Exportez vos données et utilisez un autre profil de navigateur.');session=next;let r=await remote();if(r){if((dirty||(!owner&&localStorage.getItem('travel-studio-v1')))&&JSON.stringify(data)!==JSON.stringify(r.payload)){if(owner&&revision===r.revision){/* reprise locale */}else{blocked=true;status('Conflit · action requise')}}else adopt(r)}else{revision=null;dirty=true}owner=session.user.id;persistMeta();ready=true;render();if(!blocked)schedule()}catch(e){session=null;ready=false;status('Connexion impossible');alert(e.message)}finally{busy=false}}
async function syncNow(){if(!session||!ready||busy||blocked)return;if(!navigator.onLine){status('Hors ligne · sauvegarde locale');return}busy=true;status('Synchronisation…');try{let r=await remote();if(!dirty){if(r&&r.revision!==revision)adopt(r);else if(!r&&revision!==null){blocked=true;throw Error('Sauvegarde distante supprimée')} }else{if((r?.revision??null)!==revision){blocked=true;throw Error('Modification distante détectée')}let snapshot=JSON.stringify(data),payload=JSON.parse(snapshot),result;if(revision===null){result=await api('/rest/v1/workspaces','POST',{owner:session.user.id,payload,revision:1},{Prefer:'return=representation'})}else{result=await api('/rest/v1/workspaces?owner=eq.'+session.user.id+'&revision=eq.'+revision,'PATCH',{payload,revision:revision+1},{Prefer:'return=representation'})}if(!result?.length){blocked=true;throw Error('Conflit de versions')}revision=result[0].revision;dirty=JSON.stringify(data)!==snapshot;persistMeta()}status(dirty?'Modifications en attente':'Synchronisé · '+new Date().toLocaleTimeString('fr-FR'));}catch(e){status(blocked?'Conflit · ouvrir Paramètres':'Erreur sync · données locales conservées');console.error(e)}finally{busy=false;if(dirty&&!blocked&&session&&navigator.onLine) {clearTimeout(timer);timer=setTimeout(syncNow,5000)}}}
async function resolveConflict(){if(!session||busy)return;busy=true;try{let r=await remote();if(!r)throw Error('Aucune version distante');if(!confirm('Exporter une copie locale puis charger la version distante ? Annuler conserve vos modifications locales.'))return;backup();adopt(r);blocked=false;status('Version distante chargée')}catch(e){alert(e.message)}finally{busy=false}}
async function logout(){if(busy)return;if(dirty){alert('Synchronisez ou exportez vos données avant de vous déconnecter.');return}let r=await fetch('/api/gateway?action=logout',{method:'POST'});if(r.ok){localStorage.removeItem('travel-studio-v1');localStorage.removeItem('ts-sync-meta');localStorage.removeItem('ts-config');location.reload()}}
window.addEventListener('online',syncNow);window.addEventListener('offline',()=>status('Hors ligne · sauvegarde locale'));setInterval(syncNow,15000);render();status('Connexion sécurisée…');login();
</script></html>
