<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel Studio · Accès privé</title><style>body{background:#f5f5f0;font:16px system-ui;display:grid;place-items:center;min-height:95vh;color:#26362e}form{background:white;padding:36px;border-radius:16px;width:min(320px,80vw)}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border:1px solid #ccd4cd;border-radius:8px;font:inherit}button{background:#26362e;color:white}small{color:#a33}</style><form><h1>◈ Travel Studio</h1><p>Sud tunisien · Espace privé</p><label>Code d'accès<input type="password" name="code" required maxlength="256" autofocus></label><button>Accéder</button><small role="status"></small></form><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const r=await fetch('/api/gateway?action=login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:e.target.code.value})});if(r.ok)location.reload();else document.querySelector('small').textContent='Accès refusé ou serveur indisponible.'}catch{document.querySelector('small').textContent='Connexion impossible.'}finally{b.disabled=false}}</script></html>
